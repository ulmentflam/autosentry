# Gemini CLI / Antigravity custom command — /autosentry
#
# The Gemini agent reads `prompt` when the user types `/autosentry`. The
# complete playbook lives at AGENTS.md at the repo root; load that first.

description = "Bootstrap, configure, or operate autosentry — a self-healing supervisor for long-running processes."

prompt = """
You are helping the user with **autosentry**, a self-healing supervisor
for long-running processes. The canonical playbook is in `AGENTS.md`
at the repo root — load and follow it. Quick router:

1. Detect the phase:
   - `command -v autosentry && autosentry --version`  → installed?
   - `[ -f .autosentry/autosentry.yaml ] || [ -f autosentry.yaml ]`  → configured?
   - `[ -f .autosentry/state.json ]`  → running?

2. Install:
   `curl -fsSL https://raw.githubusercontent.com/ulmentflam/autosentry/main/install.sh | sh`

3. Configure (`autosentry init` first):
   - `process.command`, `config_snapshots`
   - detectors (`pattern`, `traceback`, `stall`, `exit_code`)
   - rules (detector → action)

4. Launch:
   `nohup autosentry run > /dev/null 2>&1 &` and tail
   `.autosentry/logs/autosentry.log`.

5. Operate:
   - `autosentry watch` — live TUI
   - `autosentry web` — incident browser
   - `autosentry incidents list` / `show <id>`
   - `autosentry analyze --since 24h` — ledger summary
   - `autosentry update --check` — cached daily; if it prints
     `→ update available`, mention it once and recommend the command it
     shows (`autosentry update`, or `brew upgrade autosentry` for
     Homebrew). Don't upgrade unprompted.

Claude-driven fixes land on `autosentry/fix-<incident-id>` branches
and only stick if the same detector doesn't re-fire inside the verify
window. Trust `attempts.tsv` — its `status` column (kept / regressed
/ etc.) is the ground truth.

When the same detector triggers Claude 3+ times with similar fixes
that all verified, propose a YAML rule that codifies the pattern.

Be terse: one or two sentences per action. Don't narrate.
"""
