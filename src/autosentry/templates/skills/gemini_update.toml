# Gemini CLI / Antigravity custom command — /autosentry-update

description = "Check whether autosentry is behind the latest PyPI release and upgrade it in place, using the right backend."

prompt = """
Check for and apply an autosentry upgrade. Confirm before installing;
one sentence per step.

1. `autosentry update --check` → prints current vs latest. Add
   `--no-cache` to force a live PyPI query, `--json` to parse.

2. Up to date → report the version and stop.

3. Behind → run the recommended command (ask the user first):
   - Homebrew install → `brew upgrade autosentry`
   - uv tool / pipx / pip → `autosentry update`
   `autosentry update` auto-detects the backend; `--method` forces it,
   `--version X.Y.Z` pins a release, `--pre` allows pre-releases.

4. `autosentry --version` to confirm the new version landed.

The CLI and a running `autosentry run` monitor are separate processes —
the new version applies on the next `autosentry run`. The full operator
playbook is in `/autosentry` (not this skill).
"""
