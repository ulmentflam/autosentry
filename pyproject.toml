[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autosentry"
version = "0.7.2"
description = "Self-healing supervisor for long-running processes — watch a command, catch the failure, fix it, leave a paper trail."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Evan Owen", email = "evan@jwo3.io" }]
keywords = ["monitoring", "self-healing", "supervisor", "claude", "incident-response"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.5",
    "ruamel.yaml>=0.18",
    "rich>=13.7",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.4",
    "markdown-it-py>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pyrefly>=0.16",
    "pre-commit>=3.7",
]

[project.scripts]
autosentry = "autosentry.cli:app"

[project.urls]
Homepage = "https://github.com/ulmentflam/autosentry"
Issues = "https://github.com/ulmentflam/autosentry/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/autosentry"]

[tool.hatch.build.targets.sdist]
include = ["src/autosentry", "README.md", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "W"]
ignore = ["S603", "S607"]  # subprocess use is intentional throughout

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S108", "B017", "E501"]  # tests get a lighter touch
"src/autosentry/cli.py" = ["B008"]             # typer.Option(...) in defaults is the typer idiom

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # tree-sitter's Rust parser is unsendable; when a cache it built in a
    # worker thread is finalized on the main thread during test teardown,
    # CPython emits an unraisable warning. The exception is harmless — we
    # don't reuse parsers across threads in production. Silence it for tests.
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.pyrefly]
project-includes = ["src/autosentry"]
project-excludes = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
python-version = "3.10"
search-path = ["src"]
